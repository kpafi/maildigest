<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="t d">
  <title id="t">Three MailDigest messages in a messenger chat</title>
  <desc id="d">A summarised mail, a phishing warning with the reasons, and the daily digest of low-priority mail. Plain text only: no links, no attachments, domains defanged.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Noto Color Emoji", "Apple Color Emoji", sans-serif; font-size: 13.5px; fill: #f5f5f5; }
    .meta { fill: #8a9aa9; font-size: 12.5px; }
    .time { fill: #6c7883; font-size: 11px; }
    .head { fill: #ffffff; font-weight: 600; font-size: 15px; }
    .sub  { fill: #8a9aa9; font-size: 12px; }
    .warn { fill: #ffb454; font-weight: 600; }
    .bold { font-weight: 600; }
  </style>
  <rect width="560" height="470" rx="14" fill="#0e1621"/>
  <!-- chat header -->
  <rect x="0" y="0" width="560" height="56" fill="#17212b"/>
  <circle cx="34" cy="28" r="18" fill="#3e88c7"/>
  <text x="34" y="34" text-anchor="middle" font-size="16" fill="#fff" class="bold">M</text>
  <text x="64" y="25" class="head">MailDigest</text>
  <text x="64" y="43" class="sub">bot · text only, nothing to tap</text>

  <!-- bubble 1: a normal mail -->
  <rect x="14" y="72" width="500" height="96" rx="12" fill="#182533"/>
  <text x="28" y="96">📧 Heating meter reading on Thursday</text>
  <text x="28" y="116" class="meta">From: Meier Property Management (meier-property[.]example) · 12.03. 09:14</text>
  <text x="28" y="137">The property management announces a reading of the radiators.</text>
  <text x="28" y="156">Access required between 9 am and 1 pm.</text>
  <text x="502" y="160" text-anchor="end" class="time">09:15</text>

  <!-- bubble 2: phishing warning -->
  <rect x="14" y="184" width="500" height="152" rx="12" fill="#182533"/>
  <rect x="14" y="184" width="5" height="152" rx="2" fill="#ffb454"/>
  <text x="28" y="208" class="warn">⚠️ SUSPECTED PHISHING: sender domain does not match the claimed</text>
  <text x="28" y="226" class="warn">sender, reply address differs</text>
  <text x="28" y="248">📧 Urgent payment request [important]</text>
  <text x="28" y="268" class="meta">From: Boss (mail-security[.]example) · 12.03. 03:41</text>
  <text x="28" y="289">Alleged payment request from the boss, transfer to be made today.</text>
  <text x="28" y="310">🔍 Notes: reply address differs from the sender</text>
  <text x="502" y="328" text-anchor="end" class="time">03:42</text>

  <!-- bubble 3: low-priority digest -->
  <rect x="14" y="352" width="500" height="100" rx="12" fill="#182533"/>
  <text x="28" y="376">🗂 12 low-priority mails: 8 newsletter, 3 notification, 1 other</text>
  <text x="28" y="399" class="meta">newsletter (8):</text>
  <text x="28" y="418">• Weekly deals: up to 40 % off (shop[.]example)</text>
  <text x="28" y="437">• Your September statistics are ready (analytics[.]example)</text>
  <text x="502" y="444" text-anchor="end" class="time">18:00</text>
</svg>

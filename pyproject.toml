[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maildigest"
version = "0.3.1"
description = "Self-hosted e-mail summariser: reads a mirror mailbox over IMAP, summarises with a language model, phishing-checks with a second one and delivers text-only digests to Telegram, Discord or Signal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Suchbegriffe und Classifier sind die Metadaten, über die PyPI, libraries.io und
# Google das Paket finden — Name und Beschreibung allein reichen der PyPI-Suche nicht.
keywords = [
    "email", "e-mail", "imap", "email-digest", "email-summary", "summarizer",
    "summarization", "llm", "ai", "phishing", "phishing-detection", "security",
    "self-hosted", "telegram", "discord", "signal", "messenger", "notifications",
    "inbox", "mail-digest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]
# Mindestversionen, wo die Verträglichkeit belegt ist: pydantic 2 ist harte
# Anforderung des Codes (ConfigDict, model_validator), imap-tools ist nur in der
# 1.x-Reihe erprobt. Ohne diese Schranken erbt das Distributionspaket
# unversionierte Abhängigkeiten und lässt sich dort installieren, wo es nicht
# laufen kann — Ubuntu 24.04 liefert pydantic 1.10 (ADR-088, PLAN-PACKAGING §4).
dependencies = [
    "imap-tools>=1.0",
    "httpx",
    "pydantic>=2",
    "beautifulsoup4",
    "lxml",
    "pdfminer.six",
]

# Konsolen-Einstiegspunkt der CLI (WP9, ADR-052); gleichwertig: `python -m maildigest`.
[project.urls]
Homepage = "https://kpafi.github.io/maildigest/"
Source = "https://github.com/kpafi/maildigest"
Changelog = "https://github.com/kpafi/maildigest/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kpafi/maildigest/blob/main/docs/OPERATIONS.md"
"Security model" = "https://github.com/kpafi/maildigest/blob/main/docs/SECURITY.md"
Issues = "https://github.com/kpafi/maildigest/issues"

[project.scripts]
maildigest = "maildigest.cli:run_cli"

[project.optional-dependencies]
# `hypothesis` ist Dev-only (Property-Based-Tests, WP10/ADR-058). NF-1/NF-2 begrenzen
# ausschließlich die Laufzeit-Dependencies oben — `src/maildigest/` importiert es nie.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "hypothesis",
]

# src-Layout: Wheel enthält genau das Paket unter src/.
[tool.hatch.build.targets.wheel]
packages = ["src/maildigest"]

# Handbuchseite (ADR-087): landet bei `pip`/`pipx` unter <prefix>/share/man/man1 — bei
# pipx innerhalb des venv, also nicht im Manpfad; README nennt den Weg nach ~/.local.
[tool.hatch.build.targets.wheel.shared-data]
"man/maildigest.1" = "share/man/man1/maildigest.1"

# --- Ruff (Linter + Import-Sortierung), Begründung des Regelsatzes: ADR-010 ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests und Korpus-Generator enthalten ABSICHTLICH Homoglyphen, Zero-Width- und
# Bidi-Zeichen als Angriffs-Testdaten (WP3) — die Ambiguität ist dort der Testfall.
"tests/**" = ["RUF001", "RUF002", "RUF003"]
# Der Korpus-Generator baut Mails bewusst als lesbare Listen-Konkatenation auf.
"tests/corpus/_make_corpus.py" = ["RUF005"]
# Die Blackbox-Skripte aus WP11 sind Beweismittel, nicht Produktionscode: Sie stehen
# **wörtlich so** im Repo, wie der Cold-Tester sie gegen das installierte Wheel laufen
# ließ (docs/TESTING.md §6). Sie umzuformatieren hieße, das Protokoll nachträglich zu
# ändern; sie werden nicht importiert (tests/cold/conftest.py) und laufen in keiner CI.
# Was von ihnen automatisiert ist, steht in tests/cold/test_cold_suite.py und unterliegt
# dem vollen Regelsatz.
"tests/cold/scripts/*" = ["ALL"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (Import-Reihenfolge)
    "N",    # pep8-naming
    "UP",   # pyupgrade (moderne Syntax)
    "B",    # flake8-bugbear (häufige Bug-Muster)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-spezifische Regeln
]

# --- Mypy: strict für den Produktionscode unter src/ ---
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
